# Builds the Windows VST3 (x64) of INFINIVERB on every push and pull request,
# and uploads it as an artifact. The macOS builds are made locally.
#
# Actions are pinned to the commit of a release tag, not to the tag itself:
# a tag can be moved, a commit cannot.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DRVB1_COPY_PLUGIN_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build --config Release --parallel --target RVB1_VST3

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: INFINIVERB-windows-x64-vst3
          path: build/plugin/RVB1_artefacts/Release/VST3/INFINIVERB.vst3
          retention-days: 14
